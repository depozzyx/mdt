<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Local dev only: wp-content/uploads is gitignored and never populated by the DB import (see
    # CLAUDE.md), so every uploaded image 404s unless copied in by hand. Forward every request
    # under it straight to production instead, so real images render locally without syncing the
    # folder. Placed directly in the VirtualHost (not a separate conf-available include) so it
    # runs in the same context Apache actually serves the request in, ahead of WordPress's own
    # per-directory .htaccess rewrite.
    # Files that do exist locally (images added by tools/content-pages.php, not yet on
    # production) are served from disk.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^/wp-content/uploads/(.*)$ https://mdtgroup.com.ua/wp-content/uploads/$1 [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

